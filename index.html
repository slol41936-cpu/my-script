<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Birthday To You! 🎂</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background: radial-gradient(circle at top, #2b1055, #7597de);
      color: #fff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px 10px;
      overflow-x: hidden;
    }
    .container {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 25px;
      padding: 30px 20px;
      max-width: 520px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
      position: relative;
      z-index: 5;
    }
    .badge {
      display: inline-block;
      background: #ff4081;
      padding: 6px 18px;
      border-radius: 50px;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 12px;
      animation: pulse 1.8s infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    h1 {
      font-size: 28px;
      margin-bottom: 15px;
      color: #fff;
      text-shadow: 0 0 15px rgba(255, 105, 180, 0.8);
    }
    .profile-wrap {
      width: 140px;
      height: 140px;
      margin: 0 auto 15px;
      border-radius: 50%;
      border: 4px solid #ff4081;
      overflow: hidden;
      box-shadow: 0 0 25px rgba(255, 64, 129, 0.6);
      animation: floatImg 3s ease-in-out infinite;
    }
    @keyframes floatImg {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    .profile-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .message {
      font-size: 15px;
      line-height: 1.7;
      color: #f1f1f1;
      margin-bottom: 25px;
      background: rgba(0, 0, 0, 0.2);
      padding: 15px;
      border-radius: 12px;
    }
    /* ছবি গ্যালারি */
    .section-title {
      font-size: 18px;
      margin: 20px 0 12px;
      color: #ffe600;
      text-align: left;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }
    .gallery img {
      width: 100%;
      height: 120px;
      object-fit: cover;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      transition: transform 0.3s;
    }
    .gallery img:hover {
      transform: scale(1.04);
    }
    /* ভিডিও সেকশন */
    .video-container {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
      border-radius: 15px;
      margin-bottom: 25px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .video-container iframe, .video-container video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
      border-radius: 15px;
    }
    /* বাটন ও কন্ট্রোল */
    .action-btn {
      background: linear-gradient(45deg, #ff4081, #ff9100);
      color: #fff;
      border: none;
      padding: 12px 26px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(255, 64, 129, 0.4);
      margin: 6px;
      transition: transform 0.2s;
    }
    .action-btn:active {
      transform: scale(0.96);
    }
    /* ফ্লোটিং এফেক্ট */
    .floating-item {
      position: fixed;
      bottom: -30px;
      font-size: 24px;
      z-index: 1;
      pointer-events: none;
      animation: rise 5s linear forwards;
    }
    @keyframes rise {
      0% { transform: translateY(0) scale(0.8); opacity: 1; }
      100% { transform: translateY(-110vh) scale(1.4); opacity: 0; }
    }
  </style>
</head>
<body>

  <!-- ব্যাকগ্রাউন্ড মিউজিক (লোকাল বা অনলাইন লিঙ্ক দিতে পারেন) -->
  <audio id="bgMusic" loop src="https://cdn.pixabay.com/download/audio/2022/01/18/audio_d0a13f69d2.mp3?filename=happy-birthday-155461.mp3"></audio>

  <div class="container">
    <div class="badge">Happy Birthday! 🎈</div>

    <!-- বন্ধুর প্রধান ছবি -->
    <div class="profile-wrap">
      <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=400&q=80" alt="Friend Profile" id="mainPhoto">
    </div>

    <!-- বন্ধুর নাম -->
    <h1>শুভ জন্মদিন, [বন্ধুর নাম]! 🎂✨</h1>

    <!-- আন্তরিক শুভেচ্ছা বার্তা -->
    <div class="message">
      আজকের দিনটি শুধুই তোমার জন্য স্পেশাল! তোমার জীবনের আগামী দিনগুলো স্বপ্ন, ভালোবাসা ও অন্তহীন হাসিখুশিতে ভরে উঠুক। সর্বদা এভাবেই সাথে থেকো!
    </div>

    <!-- ছবির স্মৃতি গ্যালারি -->
    <div class="section-title">📸 আমাদের সুন্দর মুহূর্তগুলো:</div>
    <div class="gallery">
      <img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=400&q=80" alt="Memory 1">
      <img src="https://images.unsplash.com/photo-1539571696357-5a69c17a67c6?auto=format&fit=crop&w=400&q=80" alt="Memory 2">
      <img src="https://images.unsplash.com/photo-1524504388940-b1c1722653e1?auto=format&fit=crop&w=400&q=80" alt="Memory 3">
      <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=400&q=80" alt="Memory 4">
    </div>

    <!-- ইউটিউব ভিডিও বা স্পেশাল ভিডিও মেমোরি -->
    <div class="section-title">🎬 একটি বিশেষ উপহার:</div>
    <div class="video-container">
      <!-- YouTube ভিডিওর embed লিঙ্ক বসান -->
      <iframe src="https://www.youtube.com/embed/nl62hhiBMOM" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
    </div>

    <!-- মিউজিক ও সেলিব্রেশন বাটন -->
    <div>
      <button class="action-btn" onclick="toggleMusic()">🎵 গান চালু / বন্ধ</button>
      <button class="action-btn" onclick="blastLove()">💖 ভালোবাসা পাঠাও!</button>
    </div>
  </div>

  <script>
    const music = document.getElementById('bgMusic');
    let isPlaying = false;

    function toggleMusic() {
      if (isPlaying) {
        music.pause();
        isPlaying = false;
      } else {
        music.play();
        isPlaying = true;
      }
    }

    const icons = ['🎈', '💖', '🎂', '🎉', '✨', '💐', '🥳'];

    function blastLove() {
      for (let i = 0; i < 30; i++) {
        setTimeout(createFloating, i * 80);
      }
    }

    function createFloating() {
      const el = document.createElement('div');
      el.className = 'floating-item';
      el.innerText = icons[Math.floor(Math.random() * icons.length)];
      el.style.left = Math.random() * 95 + 'vw';
      el.style.animationDuration = (Math.random() * 2.5 + 3) + 's';
      document.body.appendChild(el);

      setTimeout(() => el.remove(), 5500);
    }

    // পেজ খুললে স্বয়ংক্রিয়ভাবে বেলুন ও লাভ উড়বে
    window.onload = function() {
      blastLove();
    };
  </script>
</body>
</html>
