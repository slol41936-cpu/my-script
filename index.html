<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Birthday!</title>
  <!-- Canvas Confetti লাইব্রেরি -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .card {
      background: rgba(255, 255, 255, 0.95);
      padding: 40px 30px;
      border-radius: 20px;
      text-align: center;
      max-width: 450px;
      width: 100%;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
      animation: popIn 0.8s ease-out;
    }
    @keyframes popIn {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .cake {
      font-size: 60px;
      margin-bottom: 10px;
      display: inline-block;
      animation: bounce 2s infinite;
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    h1 {
      color: #d81b60;
      font-size: 28px;
      margin-bottom: 15px;
    }
    p {
      color: #555;
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 25px;
    }
    button {
      background: linear-gradient(45deg, #ff4081, #e91e63);
      color: #fff;
      border: none;
      padding: 12px 28px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(233, 30, 99, 0.4);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    button:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 20px rgba(233, 30, 99, 0.6);
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="cake">🎂</div>
    <!-- বন্ধুর নাম এখানে বসান -->
    <h1>শুভ জন্মদিন, [বন্ধুর নাম]! 🎉</h1>
    
    <!-- আপনার শুভেচ্ছাবার্তা -->
    <p>
      জীবনের প্রতিটি দিন আনন্দে ভরে উঠুক। তোমার সব স্বপ্ন সত্যি হোক। দারুণ কাটুক তোমার এই বিশেষ দিনটি!
    </p>

    <button onclick="launchConfetti()">সেলিব্রেট করো! 🎈</button>
  </div>

  <script>
    function launchConfetti() {
      // কনফেটি ব্লাস্ট ইফেক্ট
      confetti({
        particleCount: 120,
        spread: 80,
        origin: { y: 0.6 }
      });
    }

    // পেজ লোড হওয়ার সাথে সাথে হালকা কনফেটি
    window.onload = function() {
      confetti({
        particleCount: 50,
        spread: 60,
        origin: { y: 0.7 }
      });
    };
  </script>
</body>
</html>
